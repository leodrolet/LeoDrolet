<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 — Page introuvable · Novio Studio</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0B0B0D" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" />
<style>
  :root { --bg: #0B0B0D; --ink: #F5F5F5; --ink-2: #A1A1AA; --ink-3: #8A8A93; --accent: #FF6A00; --accent-hover: #FF8126; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100dvh; background: var(--bg); color: var(--ink); font-family: "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .brand { position: absolute; top: 22px; left: clamp(20px, 5vw, 48px); display: inline-flex; align-items: center; font-size: 18px; font-weight: 600; letter-spacing: -0.03em; color: var(--ink); text-decoration: none; }
  .brand::before { content: ""; width: 10px; height: 10px; margin-right: 9px; border-radius: 50%; background: var(--accent); }
  .brand span { color: var(--ink-3); font-weight: 400; }
  .page { min-height: 100dvh; display: grid; place-content: center; justify-items: start; gap: 18px; padding: 96px clamp(20px, 5vw, 48px); max-width: 640px; margin: 0 auto; }
  .code { font-size: 0.9375rem; color: var(--accent); font-weight: 500; }
  h1 { font-size: clamp(2.25rem, 1.6rem + 3vw, 3.5rem); font-weight: 600; letter-spacing: -0.04em; line-height: 1.05; }
  p { max-width: 44ch; font-size: 1.0625rem; line-height: 1.6; color: var(--ink-2); }
  .btn { margin-top: 12px; display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 10px; background: var(--accent); color: #0B0B0D; font-weight: 500; text-decoration: none; transition: background-color 160ms; }
  .btn:hover { background: var(--accent-hover); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<a class="brand" href="/">novio<span>.studio</span></a>
<main class="page">
  <p class="code">Erreur 404</p>
  <h1>Page introuvable.</h1>
  <p>Cette page n'existe pas ou a été déplacée. Retournez à l'accueil pour continuer.</p>
  <a class="btn" href="/">Retour à l'accueil</a>
</main>
</body>
</html>
