<!DOCTYPE html>
<html lang="{{HTML_LANG}}">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}" />
<meta name="robots" content="{{ROBOTS}}" />
<meta name="author" content="Novio Studio" />
<meta name="theme-color" content="#0B0B0D" />
<meta name="color-scheme" content="dark" />
{{GA_META}}
<link rel="canonical" href="{{CANONICAL}}" />
{{ALTERNATES}}
<meta property="og:type"         content="{{OG_TYPE}}" />
<meta property="og:site_name"    content="Novio Studio" />
<meta property="og:url"          content="{{CANONICAL}}" />
<meta property="og:title"        content="{{OG_TITLE}}" />
<meta property="og:description"  content="{{OG_DESC}}" />
<meta property="og:image"        content="https://noviostudio.online/og-image.jpg" />
<meta property="og:image:width"  content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt"    content="{{OG_IMAGE_ALT}}" />
<meta property="og:locale"       content="{{OG_LOCALE}}" />
<meta name="twitter:card"        content="summary_large_image" />
<meta name="twitter:title"       content="{{OG_TITLE}}" />
<meta name="twitter:description" content="{{OG_DESC}}" />
<meta name="twitter:image"       content="https://noviostudio.online/og-image.jpg" />
<meta name="twitter:image:alt"   content="{{OG_IMAGE_ALT}}" />

<link rel="icon"             href="/favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

<script type="application/ld+json">{{JSONLD}}</script>

<!-- Police auto-hébergée (préchargée) + feuille de style intégrée : aucune ressource bloquante -->
<link rel="preload" href="/vendor/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
<style>{{CSS}}</style>
</head>
<body>

<a class="skip-link" href="#contenu">{{SKIP}}</a>

<!-- HTML pré-rendu au build (build.js), hydraté par React au chargement -->
<div id="root" {{ROOT_ATTRS}}>{{APP_HTML}}</div>

<!-- React 18 (auto-hébergé) + bundle de l'application -->
<script defer src="/vendor/react.min.js"></script>
<script defer src="/vendor/react-dom.min.js"></script>
<script defer src="/dist/bundle.min.js?v={{V}}"></script>
</body>
</html>
